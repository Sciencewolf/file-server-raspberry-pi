services:
  file-server:
    build:
      context: .
      args:
        UID: "1000"   # `id -u aron`
        GID: "1000"   # `id -g aron`
    image: file-server:${IMAGE_TAG:?hiányzik az IMAGE_TAG}
    container_name: file-server-${ENV_NAME:?hiányzik az ENV_NAME}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:?hiányzik a HOST_PORT}:8080"
    environment:
      METRICS_INTERVAL: "2"
    volumes:
      - ${HOST_DATA_DIR:?hiányzik a HOST_DATA_DIR}:/app/data
      - /etc/os-release:/host/etc/os-release:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true